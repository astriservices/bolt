<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirming payment - Bolt</title><link rel="stylesheet" href="/static/style.css"><script src="/static/app.js" defer></script></head><body><nav><a class="brand" href="/"><span class="bolt-mark">ϟ</span> Bolt</a><div class="nav-links"><a href="/usage">Workspace</a><a href="/buy">Credits</a></div></nav><main class="payment-state"><div class="panel"><span class="eyebrow">PAYMENT STATUS</span><h1 id="title">Confirming your payment</h1><p id="message"><span class="spinner"></span>Checking Stripe's payment status before updating your credits.</p><div class="actions" style="justify-content:center;margin-bottom:0"><a class="btn" href="/usage">Open workspace</a><a class="btn secondary" href="/buy">Back to credits</a></div></div></main><script>const title=document.querySelector('#title'),message=document.querySelector('#message');async function confirmPayment(){const id=new URLSearchParams(location.search).get('session_id');if(!id){title.textContent='No checkout session found';message.textContent='Open Credits and try the checkout again.';return}for(let i=0;i<4;i++){try{const r=await fetch('/api/checkout/confirm?session_id='+encodeURIComponent(id),{cache:'no-store'});const d=await r.json();if(r.ok&&d.ok){title.textContent='Payment confirmed';message.textContent='Your credits have been added. You can now return to your workspace.';return}if(r.status!==202&&r.status!==502){title.textContent='Payment needs attention';message.textContent=d.error||d.message||'Could not confirm this checkout.';return}}catch{}await new Promise(resolve=>setTimeout(resolve,1200))}title.textContent='Still waiting for confirmation';message.textContent='Stripe has not confirmed this payment yet. Your webhook can still add the credits. Refresh this page in a moment, or check the payment in Stripe test mode.'}confirmPayment();</script></body></html>
