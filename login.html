<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login - Bolt</title><link rel="stylesheet" href="/static/style.css"><script src="/static/app.js" defer></script></head><body><nav><a class="brand" href="/"><span class="bolt-mark">ϟ</span> Bolt</a><div class="nav-links"><a href="/signup">Create account</a></div></nav><main class="auth panel"><span class="eyebrow">WELCOME BACK</span><h1>Log in</h1><p>Pick up where you left off.</p><form id="f"><label for="username">Username</label><input id="username" name="username" required autocomplete="username"><label for="password">Password</label><input id="password" name="password" type="password" required autocomplete="current-password"><button class="btn" type="submit">Log in</button><p id="m" role="status"></p></form><p class="muted">Don't have an account? <a href="/signup" style="color:var(--accent)">Create one</a>.</p></main><script>document.querySelector('#f').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(f))});let d=await r.json();if(r.ok){let next=new URLSearchParams(location.search).get('next');location.href=next&&next.startsWith('/')&&!next.startsWith('//')?next:'/usage'}else document.querySelector('#m').textContent=d.error||'Login failed'};</script></body></html>
